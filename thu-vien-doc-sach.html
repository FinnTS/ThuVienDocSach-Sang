<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f1e9"><title>Hiên sách — Thư viện của bạn</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--paper:#f5f1e9;--ink:#20241e;--muted:#73766d;--green:#465d48;--line:#dedbd1;--card:#fffdf8;--gold:#d4a85f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#ede9df;border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column}.brand{font:700 27px 'Playfair Display',serif;letter-spacing:-.5px}.brand span{color:var(--green)}.tag{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin:7px 0 44px}.nav{font-size:13px;color:var(--muted);padding:12px 14px;border-radius:10px}.nav.active{background:#dfe4d8;color:var(--green);font-weight:700}.side-note{margin-top:auto;font:italic 15px/1.6 'Playfair Display',serif;color:#77796e}.main{padding:36px clamp(22px,5vw,76px);max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--green);font-weight:700}.top h1{font:700 clamp(30px,4vw,44px) 'Playfair Display',serif;margin:8px 0}.sub{color:var(--muted);font-size:14px}.add{background:var(--green);color:white;border:0;border-radius:9px;padding:13px 18px;font-weight:600;box-shadow:0 5px 14px #465d4826}.add:hover{background:#344937}.stats{display:flex;gap:12px;margin:28px 0}.pill{font-size:12px;border:1px solid var(--line);padding:9px 13px;border-radius:30px;color:var(--muted);background:#ffffff55}.pill b{color:var(--ink)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin:30px 0 22px}.search{max-width:330px;width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:9px;padding:11px 14px;outline:none}.search:focus{border-color:var(--green)}.sort{border:1px solid var(--line);background:transparent;padding:10px 12px;border-radius:8px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:26px 21px}.book{cursor:pointer;min-width:0}.cover{height:240px;border-radius:5px 12px 12px 5px;background:linear-gradient(145deg,#758b70,#394c3e);box-shadow:5px 7px 14px #28271d22;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;transition:transform .2s}.book:hover .cover{transform:translateY(-4px)}.cover:before{content:'';position:absolute;inset:0 auto 0 10px;width:1px;background:#ffffff32}.cover img{position:absolute;width:100%;height:100%;object-fit:cover}.cover img+.cover-title{display:none}.cover-title{position:relative;font:600 21px/1.28 'Playfair Display',serif;text-shadow:0 2px 8px #0008;max-height:85%;overflow:hidden}.book-title{font:600 15px/1.35 'Playfair Display',serif;margin:12px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book-meta{font-size:12px;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;padding:65px 18px;border:1px dashed #c9c6bb;border-radius:14px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font:600 21px 'Playfair Display',serif;margin:13px}.empty button{margin-top:14px}.hint{font-size:12px;margin-top:9px;line-height:1.6}.reader{position:fixed;inset:0;background:#181a18ee;z-index:5;display:none;flex-direction:column;padding:16px 22px}.reader.open{display:flex}.reader-head{display:flex;justify-content:space-between;align-items:center;color:white;padding-bottom:13px}.reader-head h2{font:600 20px 'Playfair Display',serif;margin:0}.close{background:#ffffff16;color:white;border:1px solid #ffffff40;border-radius:8px;padding:9px 14px}.pdfview{flex:1;border:0;border-radius:5px;background:#4b4b4b}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263a2b;color:white;padding:12px 17px;border-radius:9px;display:none;z-index:9;font-size:13px}.toast.show{display:block}.mobile-add{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:25px 19px}.top{align-items:flex-start}.add{padding:11px 12px;font-size:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:20px 14px}.cover{height:195px}.stats{margin:20px 0}.reader{padding:11px}.reader-head h2{font-size:16px}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script></head>
<body><div class="layout"><aside class="side"><div class="brand">Hiên <span>sách</span></div><div class="tag">Không gian đọc riêng</div><div class="nav active">▦　Thư viện của tôi</div><div class="side-note">“Một căn phòng không có sách giống như một cơ thể không có linh hồn.”<br><small>— Cicero</small></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Góc đọc của bạn</div><h1>Thư viện</h1><div class="sub">Những câu chuyện đang chờ bạn mở ra.</div></div><button class="add" id="addBtn">＋　Thêm sách PDF</button></header><div class="stats"><div class="pill"><b id="count">0</b> cuốn sách</div><div class="pill">PDF và ảnh bìa của bạn</div></div><section class="toolbar"><input class="search" id="search" placeholder="⌕　Tìm tên sách..." aria-label="Tìm sách"><select class="sort" id="sort"><option value="new">Mới thêm trước</option><option value="az">Tên A → Z</option></select></section><section class="grid" id="grid"></section></main></div>
<input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple hidden><input id="folderInput" type="file" accept="application/pdf,.pdf,image/*" webkitdirectory multiple hidden>
<section class="reader" id="reader"><div class="reader-head"><h2 id="readerTitle"></h2><button class="close" id="closeReader">Đóng　×</button></div><iframe class="pdfview" id="pdfview" title="Trình đọc PDF"></iframe></section><div class="toast" id="toast"></div>
<script>
const DB='hien-sach-db',STORE='books';let db,books=[],objectUrl=null;const $=s=>document.querySelector(s);function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function tx(mode){return db.transaction(STORE,mode).objectStore(STORE)}function allBooks(){return new Promise((res,rej)=>{const r=tx('readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function saveBook(b){return new Promise((res,rej)=>{const r=tx('readwrite').put(b);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function removeBook(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function cleanName(s){return s.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()||'Sách chưa đặt tên'}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600)}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function findCover(title){return new Promise(resolve=>{const callback='bookCover_'+Date.now()+'_'+Math.random().toString(36).slice(2);const timer=setTimeout(()=>{delete window[callback];script.remove();resolve(null)},7000);const script=document.createElement('script');window[callback]=data=>{clearTimeout(timer);delete window[callback];script.remove();const items=data.items||[];const norm=x=>(x||'').toLocaleLowerCase('vi').replace(/[^\p{L}\p{N}]+/gu,' ').trim();items.sort((a,b)=>Number(norm(b.volumeInfo?.title)===norm(title))-Number(norm(a.volumeInfo?.title)===norm(title)));const links=items[0]?.volumeInfo?.imageLinks;resolve((links?.thumbnail||links?.smallThumbnail||null)?.replace(/^http:/,'https:')||null)};script.onerror=()=>{clearTimeout(timer);delete window[callback];resolve(null)};script.src='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('intitle:'+title)+'&maxResults=5&callback='+callback;document.head.appendChild(script)})}
async function coverFromPdf(file){try{if(!window.pdfjsLib)return null;const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const page=await pdf.getPage(1);const base=page.getViewport({scale:1});const viewport=page.getViewport({scale:Math.min(1,320/base.width)});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const image=canvas.toDataURL('image/jpeg',.82);pdf.destroy();return image}catch{return null}}function render(){const q=$('#search').value.toLocaleLowerCase('vi');let list=books.filter(b=>b.title.toLocaleLowerCase('vi').includes(q));if($('#sort').value==='az')list.sort((a,b)=>a.title.localeCompare(b.title,'vi'));else list.sort((a,b)=>b.added-a.added);$('#count').textContent=books.length;$('#grid').innerHTML=list.length?list.map(b=>`<article class="book" data-id="${esc(b.id)}" title="Mở sách"><div class="cover">${b.cover?`<img src="${b.cover}" alt="Bìa ${esc(b.title)}">`:''}<span class="cover-title">${esc(b.title)}</span></div><div class="book-title">${esc(b.title)}</div><div class="book-meta">PDF · ${new Date(b.added).toLocaleDateString('vi-VN')}</div></article>`).join(''):`<div class="empty"><div style="font-size:30px">⌑</div><strong>${q?'Không tìm thấy sách':'Kệ sách đang chờ những cuốn đầu tiên'}</strong><div>${q?'Thử một từ khóa khác.':'Chọn file PDF hoặc cả thư mục để tự thêm sách vào thư viện.'}</div>${!q?'<button class="add" onclick="document.querySelector(\'#addBtn\').click()">＋　Chọn sách PDF</button><div class="hint">Ảnh bìa JPG/PNG cùng tên với PDF sẽ tự ghép.<br>Ví dụ: <i>Đắc nhân tâm.pdf</i> + <i>Đắc nhân tâm.jpg</i></div>':''}</div>`;document.querySelectorAll('.book').forEach(el=>el.onclick=()=>read(el.dataset.id))}
async function ingest(files){let missingCovers=0;const arr=Array.from(files),images=arr.filter(f=>f.type.startsWith('image/')),pdfs=arr.filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));if(!pdfs.length){toast('Không tìm thấy file PDF trong lựa chọn.');return}for(const f of pdfs){const key=cleanName(f.name).toLocaleLowerCase('vi');let cover=images.find(i=>cleanName(i.name).toLocaleLowerCase('vi')===key);let coverData=null;if(cover)coverData=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(cover)});else{coverData=await findCover(cleanName(f.name));if(!coverData)coverData=await coverFromPdf(f);if(!coverData)missingCovers++}const id=f.name+'|'+f.lastModified+'|'+f.size;await saveBook({id,title:cleanName(f.name),file:f,cover:coverData,added:Date.now()})}books=await allBooks();render();toast(missingCovers?`Da them ${pdfs.length} sach. ${missingCovers} cuon chua co anh bia; vui long tu chon anh bia.`:`Da them ${pdfs.length} cuon sach.`)}async function read(id){const b=books.find(x=>x.id===id);if(!b)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(b.file);$('#readerTitle').textContent=b.title;$('#pdfview').src=objectUrl+'#toolbar=1&navpanes=0';$('#reader').classList.add('open')}$('#addBtn').onclick=()=>$('#pdfInput').click();$('#pdfInput').onchange=e=>{ingest(e.target.files);e.target.value=''};$('#search').oninput=render;$('#sort').onchange=render;$('#closeReader').onclick=()=>{ $('#reader').classList.remove('open');$('#pdfview').src='about:blank';if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#closeReader').click()});
// Gợi ý quét cả thư mục bằng cách giữ Shift khi nhấn nút thêm sách.
$('#addBtn').addEventListener('click',e=>{if(e.shiftKey){e.preventDefault();$('#folderInput').click()}});$('#folderInput').onchange=e=>{ingest(e.target.files);e.target.value=''};
(async()=>{try{db=await openDB();books=await allBooks();render()}catch(e){$('#grid').innerHTML='<div class="empty"><strong>Trình duyệt chưa cho phép lưu thư viện.</strong>Hãy mở file bằng Chrome, Edge hoặc Firefox mới nhất.</div>'}})();
</script></body></html>
